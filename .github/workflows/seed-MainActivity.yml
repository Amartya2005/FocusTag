name: seed-MainActivity
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write MainActivity
        run: |
          python3 << 'PY'
          import zlib, base64, pathlib, subprocess
          path = "app/src/main/java/com/focustag/app/MainActivity.kt"
          z = ""
