          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_bytes(zlib.decompress(base64.b64decode(z)))
          print("wrote", path, p.stat().st_size)
          subprocess.check_call(["git", "config", "user.email", "184850924+Amartya2005@users.noreply.github.com"])
          subprocess.check_call(["git", "config", "user.name", "Amartya Sarangee"])
          subprocess.check_call(["git", "add", "--", path])
          subprocess.check_call(["git", "commit", "-m", "seed: FocusTag MainActivity"])
